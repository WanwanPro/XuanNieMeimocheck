name: Build Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: meimoai-checkin

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and run tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-audit --no-fund
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg TZ=Asia/Shanghai \
            --tag "${IMAGE_NAME}:${short_sha}" \
            --tag "${IMAGE_NAME}:latest" \
            --load \
            .

      - name: Export image and checksum
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          archive="meimoai-checkin-${short_sha}-amd64.tar.gz"
          docker save "${IMAGE_NAME}:${short_sha}" "${IMAGE_NAME}:latest" | gzip -6 > "${archive}"
          sha256sum "${archive}" > "${archive}.sha256"
          echo "ARCHIVE_NAME=${archive}" >> "${GITHUB_ENV}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meimoai-checkin-image-${{ github.sha }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "${tag}" >/dev/null 2>&1 || \
            gh release create "${tag}" --title "${tag}" --notes "MeimoAI Checkin Docker image (linux/amd64)."
          gh release upload "${tag}" "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256" --clobber